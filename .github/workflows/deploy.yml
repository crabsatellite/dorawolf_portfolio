name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # Use `npm install` rather than `npm ci` because some transitive
        # deps (cn-font-split → @emnapi/runtime) are platform-specific and
        # don't end up in a Windows-generated lockfile. `npm install`
        # tolerates the drift and fills in the missing Linux bindings.
        run: npm install --no-audit --no-fund

      # Cache the generated AVIF/WebP variants. Hashing every original keeps
      # the cache valid as long as nothing in the source images changed.
      # First cold build is slow (~10 min); subsequent runs hit cache and
      # skip re-encoding entirely.
      - name: Restore image variants cache
        id: image-cache
        uses: actions/cache@v4
        with:
          path: |
            public/**/*.avif
            public/**/*.webp
            public/.image-manifest.json
          key: image-variants-v2-${{ hashFiles('public/projects/**/*.jpg', 'public/projects/**/*.png', 'public/research/**/*.jpg', 'public/research/**/*.png', 'scripts/build-images.mjs') }}
          restore-keys: |
            image-variants-v2-

      - name: Build (prebuild generates any missing image variants)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
